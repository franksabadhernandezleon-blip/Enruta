name: enruta

services:
  # Postgres local de RESPALDO: la base real es Supabase y su URL llega como secreto
  # DATABASE_URL por /run/base44/app.env. Este servicio solo se usa cuando el dashboard
  # todavía no tiene DATABASE_URL, para que el preview arranque igual.
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: enruta
      POSTGRES_PASSWORD: enruta_dev_password
      POSTGRES_DB: enruta
    volumes:
      - enruta_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enruta -d enruta"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: aplica api/db/schema.sql (idempotente) y siembra la demo si `users` está vacía.
  # Corre contra el DATABASE_URL vigente: Supabase si el dashboard lo definió, si no el db local.
  migrate:
    image: node:22
    working_dir: /app
    restart: "no"
    env_file:
      - ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    volumes:
      - ./api:/app
      - enruta_api_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run migrate"]

  api:
    image: node:22
    working_dir: /app
    restart: on-failure
    labels:
      base44.project: ENRUTA API
      base44.kind: api
    env_file:
      - ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 8000
      UPLOAD_DIR: /app/uploads
      PROOF_DIR: /app/proofs
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    volumes:
      - ./api:/app
      - enruta_api_modules:/app/node_modules
      - enruta_uploads:/app/uploads
      - enruta_proofs:/app/proofs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    labels:
      base44.project: ENRUTA
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
    volumes:
      - ./web:/app
      - enruta_web_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  enruta_db:
  enruta_api_modules:
  enruta_web_modules:
  enruta_uploads:
  enruta_proofs:
